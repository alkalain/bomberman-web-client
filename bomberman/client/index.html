<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoomBastic Frogz</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>Bomberman</h1>
    <p>Use the arrow keys to move and spacebar to place bombs.</p>

    <div class="top-actions">
      <button id="btn-open-scoreboard" class="scoreboard-btn scoreboard-btn-primary" type="button">
        🏆 Afficher le Scoreboard de fin
      </button>
    </div>

    <div id="game-container">
      
      <!-- HUD DES VIES AU-DESSUS DE LA MAP -->
      <div class="hud">
        <!-- Joueur 1 -->
        <div class="hud-bloc bleu">
          <img src="img/bleu/apercu1.png" alt="J1" />
          <span>❤️ 3</span>
        </div>

        <!-- Joueur 2 -->
        <div class="hud-bloc jaune">
          <img src="img/jaune/apercu1.png" alt="J2" />
          <span>❤️ 3</span>
        </div>

        <!-- Rectangle vide pour le timer -->
        <div class="hud-timer"></div>

        <!-- Joueur 3 -->
        <div class="hud-bloc rouge">
          <img src="img/rouge/apercu1.png" alt="J3" />
          <span>❤️ 3</span>
        </div>

        <!-- Joueur 4 -->
        <div class="hud-bloc rose">
          <img src="img/rose/apercu1.png" alt="J4" />
          <span>❤️ 3</span>
        </div>
      </div>

      <canvas id="game" width="792" height="500"></canvas>

      <!-- Scoreboard de fin de partie -->
      <div id="scoreboard-overlay" class="scoreboard-overlay">
        <div class="scoreboard-modal">
          
          <!-- Logo en haut -->
          <img src="img/logo.png" alt="Logo BoomBastic Frogz" class="scoreboard-logo" />

          <div class="scoreboard-header">
            <span class="scoreboard-badge-fin">FIN DE LA PARTIE</span>
            <h2 id="scoreboard-title">CLASSEMENT FINAL</h2>
            <p id="scoreboard-subtitle" class="scoreboard-subtitle"></p>
          </div>

          <div class="scoreboard-table-wrapper">
            <table class="scoreboard-table" id="scoreboard-table">
              <thead>
                <tr>
                  <th>Rang</th>
                  <th>Joueur</th>
                  <th>Statut</th>
                  <th>Points de vie</th>
                </tr>
              </thead>
              <tbody id="scoreboard-body">
                <!-- Rempli automatiquement par scoreboard.js -->
              </tbody>
            </table>
          </div>

          <div class="scoreboard-footer">
            <button id="btn-switch-scenario" class="scoreboard-btn scoreboard-btn-secondary" type="button">
              🔄 Changer de scénario fictif (1/3)
            </button>
            <button id="btn-close-scoreboard" class="scoreboard-btn scoreboard-btn-primary" type="button">
              🎮 Retour au jeu
            </button>
          </div>

        </div>
      </div>
    </div>

    <script src="js/game/map.js"></script>
    <script src="js/game/game.js"></script>
    <script src="js/ui/scoreboard.js"></script>
  </body>
</html>
